<title>Moon Jar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Serif+KR:wght@600&display=swap">

<style>
  /* 달항아리 — one rule: same moon + same moon = a fuller moon.
     A moon is a light source, so the world is night. Committed single theme;
     every colour painted explicitly so the page never borrows a host ground. */
  :root {
    --sky-0: #060912;
    --sky-1: #0e1628;
    --sky-2: #16203a;
    --paper: #f3eee2;
    --paper-dim: #b9b3a4;
    --seal: #c9463a;
    --gold: #e8c477;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; overscroll-behavior: none; }
  body {
    background: var(--sky-0);
    color: var(--paper);
    font-family: "Gowun Batang", "Nanum Myeongjo", Georgia, serif;
    display: flex; flex-direction: column; align-items: center;
    overflow: hidden; touch-action: none;
    user-select: none; -webkit-user-select: none;
  }

  header {
    position: relative; z-index: 2; width: 100%; max-width: 480px;
    display: flex; align-items: flex-start; justify-content: space-between;
    padding: 12px 18px 2px; gap: 12px;
  }
  .score {
    font-family: "Noto Serif KR", serif; font-weight: 600;
    font-size: 42px; line-height: 1; letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums; color: var(--paper);
    text-shadow: 0 0 24px rgba(232,196,119,0.28);
  }
  .best {
    font-size: 12.5px; color: var(--paper-dim); margin-top: 5px;
    font-variant-numeric: tabular-nums; letter-spacing: 0.04em;
  }
  .best b { color: var(--gold); font-weight: 700; }

  button.icon {
    width: 46px; height: 46px; flex: 0 0 46px; margin-top: 2px;
    border-radius: 50%; border: 1px solid rgba(243,238,226,0.22);
    background: rgba(243,238,226,0.06); color: var(--paper);
    cursor: pointer; display: grid; place-items: center;
    transition: background 0.15s, transform 0.08s;
  }
  button.icon:hover { background: rgba(243,238,226,0.16); }
  button.icon:active { transform: scale(0.93); }
  button.icon:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }
  button.icon svg { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 1.7; }

  #stage { position: relative; z-index: 1; flex: 1; width: 100%; }
  canvas { display: block; width: 100%; height: 100%; }

  .ladder {
    position: relative; z-index: 2; display: flex; align-items: center;
    justify-content: center; gap: 5px; padding: 6px 0 14px;
  }
  .ladder i {
    display: block; border-radius: 50%;
    background: radial-gradient(circle at 34% 30%, #fffdf4 0%, #ffeec2 55%, #c9b184 100%);
    box-shadow: 0 0 10px rgba(255,231,168,0.4);
  }
  .ladder u {
    width: 5px; height: 1px; background: rgba(243,238,226,0.3); display: block;
  }

  .over {
    position: fixed; inset: 0; z-index: 10; display: none;
    align-items: center; justify-content: center; padding: 20px;
    background: rgba(6,9,18,0.86); backdrop-filter: blur(3px);
  }
  .over.on { display: flex; }
  .card {
    width: 100%; max-width: 330px; text-align: center;
    background: linear-gradient(180deg, #141d33, #0b1120);
    border: 1px solid rgba(243,238,226,0.16);
    border-radius: 3px; padding: 28px 24px 24px;
    box-shadow: 0 24px 60px rgba(0,0,0,0.6);
  }
  .card .seal {
    width: 44px; height: 44px; margin: 0 auto 16px; border-radius: 3px;
    background: var(--seal); color: #fdf6ee; display: grid; place-items: center;
    font-family: "Noto Serif KR", serif; font-size: 20px; font-weight: 600;
  }
  .card h1 { margin: 0; font-family: "Noto Serif KR", serif; font-weight: 600; font-size: 21px; }
  .card .big {
    font-family: "Noto Serif KR", serif; font-size: 56px; font-weight: 600;
    line-height: 1.04; margin: 12px 0 2px; color: var(--gold);
    font-variant-numeric: tabular-nums; text-shadow: 0 0 30px rgba(232,196,119,0.3);
  }
  .card .sub { color: var(--paper-dim); font-size: 13px; }
  .card .again {
    margin-top: 22px; width: 100%; padding: 15px; cursor: pointer;
    font-family: "Gowun Batang", serif; font-size: 16px; font-weight: 700;
    color: #0b1120; background: var(--paper); border: 0; border-radius: 2px;
  }
  .card .again:active { transform: translateY(1px); }
  .card .again:focus-visible { outline: 2px solid var(--gold); outline-offset: 3px; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<header>
  <div>
    <div class="score" id="score">0</div>
    <div class="best">최고 <b id="best">0</b></div>
  </div>
  <button class="icon" id="restart" aria-label="다시 시작">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M20 12a8 8 0 1 1-2.3-5.6" stroke-linecap="round"/>
      <path d="M20 4v4h-4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
</header>

<div id="stage"><canvas id="c"></canvas></div>
<div class="ladder" id="ladder" aria-hidden="true"></div>

<div class="over" id="over">
  <div class="card">
    <div class="seal">滿</div>
    <h1 id="verdict">항아리가 찼습니다</h1>
    <div class="big" id="finalScore">0</div>
    <div class="sub" id="finalSub">가장 큰 달 · 티끌</div>
    <button class="again" id="again">다시</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  // ── the ladder: eight rungs, one rule ───────────────────────────────────────
  // `phase` is how much of the disc is lit, so the ladder is visibly a moon
  // filling out. Nothing here requires reading.
  const TIERS = [
    { r: 12, name: '티끌',     phase: 0.10 },
    { r: 16, name: '별',       phase: 0.18 },
    { r: 21, name: '신월',     phase: 0.28 },
    { r: 27, name: '초승달',   phase: 0.40 },
    { r: 35, name: '반달',     phase: 0.54 },
    { r: 44, name: '상현달',   phase: 0.72 },
    { r: 55, name: '보름달',   phase: 1.00 },
    { r: 68, name: '달항아리', phase: 1.00 },
  ];
  const DROPPABLE = 4;
  const GRAVITY = 0.62;
  const AIR = 0.994;
  const WALL_BOUNCE = 0.34;
  const FLOOR_BOUNCE = 0.20;
  const OVERFLOW_GRACE = 1400;

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const stage = document.getElementById('stage');

  let W = 360, H = 600, DPR = 1;
  let jar = { cx: 180, top: 150, bottom: 560, rmax: 150 };
  let stars = [];
  let sprites = [];

  // ── procedurally baked moon sprites ─────────────────────────────────────────
  // Generating them once, offscreen, buys three things: the phase can be carved
  // with destination-out without touching the scene behind it, the bloom travels
  // with the moon, and drawing a whole jar of moons costs eight drawImage calls.
  function makeSprite(tier) {
    const t = TIERS[tier];
    const r = t.r;
    const pad = Math.ceil(r * 1.15);
    const size = Math.ceil((r + pad) * 2);
    const cv = document.createElement('canvas');
    cv.width = Math.ceil(size * DPR);
    cv.height = Math.ceil(size * DPR);
    const g = cv.getContext('2d');
    g.setTransform(DPR, 0, 0, DPR, 0, 0);
    const c = size / 2;

    // bloom
    const bl = g.createRadialGradient(c, c, r * 0.7, c, c, r + pad);
    bl.addColorStop(0, 'rgba(255,232,170,0.34)');
    bl.addColorStop(0.45, 'rgba(255,226,150,0.12)');
    bl.addColorStop(1, 'rgba(255,226,150,0)');
    g.fillStyle = bl;
    g.fillRect(0, 0, size, size);

    // body
    g.save();
    g.beginPath();
    g.arc(c, c, r, 0, Math.PI * 2);
    g.clip();
    const bg = g.createRadialGradient(c - r * 0.34, c - r * 0.38, r * 0.12, c, c, r * 1.15);
    bg.addColorStop(0, '#fffefa');
    bg.addColorStop(0.42, '#fff4d8');
    bg.addColorStop(0.82, '#f0dcae');
    bg.addColorStop(1, '#cdb686');
    g.fillStyle = bg;
    g.fillRect(0, 0, size, size);

    // maria — a fixed pseudo-random field per tier so each moon has a face
    let s = (tier + 1) * 9301;
    const rand = () => ((s = (s * 9301 + 49297) % 233280) / 233280);
    const craters = 3 + tier;
    for (let k = 0; k < craters; k++) {
      const a = rand() * 6.283;
      const d = Math.pow(rand(), 0.6) * r * 0.72;
      const cr = r * (0.09 + rand() * 0.17);
      g.globalAlpha = 0.07 + rand() * 0.07;
      g.fillStyle = '#8d7a52';
      g.beginPath();
      g.arc(c + Math.cos(a) * d, c + Math.sin(a) * d, cr, 0, 6.283);
      g.fill();
    }
    g.globalAlpha = 1;

    // terminator: carve the unlit part away entirely
    if (t.phase < 0.999) {
      g.globalCompositeOperation = 'destination-out';
      const shift = r * (1 - t.phase) * 1.55;
      g.beginPath();
      g.ellipse(c + shift + r * 0.1, c, r * 1.04, r * 1.04, 0, 0, 6.283);
      g.fill();
      g.globalCompositeOperation = 'source-over';
    }
    g.restore();

    // limb light along the lit edge
    g.save();
    g.beginPath();
    g.arc(c, c, r, 0, Math.PI * 2);
    g.clip();
    const lg = g.createRadialGradient(c - r * 0.5, c - r * 0.5, r * 0.2, c - r * 0.3, c - r * 0.3, r * 1.2);
    lg.addColorStop(0, 'rgba(255,255,255,0.5)');
    lg.addColorStop(1, 'rgba(255,255,255,0)');
    g.globalCompositeOperation = 'source-atop';
    g.fillStyle = lg;
    g.fillRect(0, 0, size, size);
    g.restore();

    return { cv, size };
  }

  function resize() {
    const rect = stage.getBoundingClientRect();
    DPR = Math.min(2.5, window.devicePixelRatio || 1);
    W = Math.max(280, rect.width);
    H = Math.max(360, rect.height);
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    const rmax = Math.min((W - 26) / 2, H * 0.33);
    jar = { cx: W / 2, top: Math.max(104, H * 0.215), bottom: H - 16, rmax };

    sprites = TIERS.map((_, i) => makeSprite(i));

    stars = [];
    let s = 12345;
    const rand = () => ((s = (s * 9301 + 49297) % 233280) / 233280);
    for (let i = 0; i < 90; i++) {
      stars.push({ x: rand() * W, y: rand() * H, r: rand() * 1.15 + 0.25, a: 0.15 + rand() * 0.5, tw: rand() * 6.283 });
    }
  }

  /** interior half-width of the jar at a given y — the bulge IS the silhouette */
  function halfWidth(y) {
    const t = (y - jar.top) / Math.max(1, jar.bottom - jar.top);
    if (t <= 0) return jar.rmax * 0.62;
    const tc = Math.min(1, t);
    return jar.rmax * (0.62 + 0.38 * Math.sin(Math.PI * Math.pow(tc, 0.82)));
  }

  // ── state ───────────────────────────────────────────────────────────────────
  let balls = [], sparks = [], rings = [];
  let score = 0, best = 0, biggest = 0;
  let nextTier = 0, queuedTier = 0;
  let aimX = 0, dropCooldown = 0, overflowSince = 0;
  let running = true, flash = 0, t0 = 0;
  try { best = Number(localStorage.getItem('moonjar.best') || 0) || 0; } catch (e) { best = 0; }

  const rnd = (a, b) => a + Math.random() * (b - a);

  function reset() {
    balls = []; sparks = []; rings = [];
    score = 0; biggest = 0; overflowSince = 0; dropCooldown = 0; flash = 0;
    running = true;
    nextTier = Math.floor(Math.random() * DROPPABLE);
    queuedTier = Math.floor(Math.random() * DROPPABLE);
    aimX = jar.cx;
    document.getElementById('over').classList.remove('on');
    paint();
  }
  function paint() {
    document.getElementById('score').textContent = String(score);
    document.getElementById('best').textContent = String(best);
  }

  // ── sound: a rising pentatonic chime, synthesised ───────────────────────────
  let ac = null;
  const PENTA = [0, 2, 4, 7, 9, 12, 16, 19];
  function chime(tier) {
    try {
      if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
      if (ac.state === 'suspended') ac.resume();
      const f = 261.63 * Math.pow(2, PENTA[Math.min(PENTA.length - 1, tier)] / 12);
      const t = ac.currentTime;
      [1, 2.01].forEach((h, k) => {
        const o = ac.createOscillator(), g = ac.createGain();
        o.type = k ? 'triangle' : 'sine';
        o.frequency.value = f * h;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.exponentialRampToValueAtTime(k ? 0.05 : 0.15, t + 0.01);
        g.gain.exponentialRampToValueAtTime(0.0001, t + (k ? 0.3 : 0.7));
        o.connect(g).connect(ac.destination);
        o.start(t); o.stop(t + 0.75);
      });
    } catch (e) { /* sound is a nicety */ }
  }

  // ── input: pointer events, so mouse and touch are the same code path ────────
  // (the previous build read e.touches on touchend, which is empty there — the
  //  aim became NaN and the game silently broke on every phone.)
  function localX(e) {
    const rect = canvas.getBoundingClientRect();
    return e.clientX - rect.left;
  }
  function clampAim(x) {
    const r = TIERS[nextTier].r;
    const lim = Math.max(6, halfWidth(jar.top) - r - 2);
    return Math.max(jar.cx - lim, Math.min(jar.cx + lim, x));
  }
  function drop(x) {
    if (!running || dropCooldown > 0) return;
    aimX = clampAim(x);
    balls.push({ x: aimX, y: jar.top - 34, tier: nextTier, vx: 0, vy: 1.6, r: TIERS[nextTier].r, squash: 0 });
    nextTier = queuedTier;
    queuedTier = Math.floor(Math.random() * DROPPABLE);
    dropCooldown = 14;
  }
  canvas.addEventListener('pointerdown', (e) => {
    e.preventDefault();
    aimX = clampAim(localX(e));
    drop(aimX);
  });
  canvas.addEventListener('pointermove', (e) => {
    if (running) aimX = clampAim(localX(e));
  });
  document.getElementById('restart').addEventListener('click', reset);
  document.getElementById('again').addEventListener('click', reset);

  // ── physics ─────────────────────────────────────────────────────────────────
  function step() {
    if (dropCooldown > 0) dropCooldown--;
    if (flash > 0) flash -= 0.05;

    for (const b of balls) {
      b.vy += GRAVITY;
      b.vx *= AIR;
      b.vy *= 0.997;
      b.x += b.vx;
      b.y += b.vy;
      if (b.squash > 0) b.squash *= 0.86;

      const hw = halfWidth(b.y) - b.r;
      const dx = b.x - jar.cx;
      if (dx > hw) { b.x = jar.cx + hw; b.vx = -Math.abs(b.vx) * WALL_BOUNCE; }
      else if (dx < -hw) { b.x = jar.cx - hw; b.vx = Math.abs(b.vx) * WALL_BOUNCE; }

      if (b.y + b.r > jar.bottom) {
        if (b.vy > 2.4) b.squash = Math.min(0.32, b.vy * 0.045);
        b.y = jar.bottom - b.r;
        b.vy = -Math.abs(b.vy) * FLOOR_BOUNCE;
        b.vx *= 0.88;
      }
    }

    // two passes of separation makes stacks settle instead of shivering
    for (let pass = 0; pass < 2; pass++) {
      for (let i = 0; i < balls.length; i++) {
        for (let j = i + 1; j < balls.length; j++) {
          const a = balls[i], b = balls[j];
          const dx = b.x - a.x, dy = b.y - a.y;
          const rr = a.r + b.r;
          const d2 = dx * dx + dy * dy;
          if (d2 > rr * rr) continue;
          const d = Math.sqrt(d2) || 0.0001;

          if (a.tier === b.tier) { merge(i, j); i = -1; break; }

          const nx = dx / d, ny = dy / d;
          const overlap = (rr - d) * 0.5;
          const wa = b.r / rr, wb = a.r / rr;
          a.x -= nx * overlap * wa * 2; a.y -= ny * overlap * wa * 2;
          b.x += nx * overlap * wb * 2; b.y += ny * overlap * wb * 2;
          const rel = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
          if (rel < 0) {
            const imp = rel * 0.55;
            a.vx += nx * imp; a.vy += ny * imp;
            b.vx -= nx * imp; b.vy -= ny * imp;
            if (rel < -3) { a.squash = b.squash = Math.min(0.28, -rel * 0.04); }
          }
        }
      }
    }

    let above = false;
    for (const b of balls) {
      if (b.y - b.r < jar.top - 6 && Math.abs(b.vy) < 1.8) { above = true; break; }
    }
    const now = performance.now();
    if (above) {
      if (!overflowSince) overflowSince = now;
      else if (now - overflowSince > OVERFLOW_GRACE) gameOver();
    } else overflowSince = 0;

    for (let i = sparks.length - 1; i >= 0; i--) {
      const s = sparks[i];
      s.x += s.vx; s.y += s.vy; s.vy += 0.07; s.life--;
      if (s.life <= 0) sparks.splice(i, 1);
    }
    for (let i = rings.length - 1; i >= 0; i--) {
      rings[i].t += 0.055;
      if (rings[i].t >= 1) rings.splice(i, 1);
    }
  }

  function merge(i, j) {
    const a = balls[i], b = balls[j];
    const tier = a.tier;
    const x = (a.x + b.x) / 2, y = (a.y + b.y) / 2;
    balls.splice(Math.max(i, j), 1);
    balls.splice(Math.min(i, j), 1);

    score += (tier + 1) * (tier + 2) * 3;
    biggest = Math.max(biggest, tier + 1);
    chime(tier);
    rings.push({ x, y, r0: TIERS[tier].r, t: 0 });
    burst(x, y, TIERS[tier].r);
    flash = Math.min(0.5, 0.12 + tier * 0.05);

    if (tier + 1 < TIERS.length) {
      balls.push({ x, y, tier: tier + 1, vx: 0, vy: -1.4, r: TIERS[tier + 1].r, squash: -0.22 });
    } else {
      score += 800;
      rings.push({ x, y, r0: TIERS[tier].r * 1.7, t: 0 });
      burst(x, y, TIERS[tier].r * 1.8);
      flash = 0.75;
      chime(TIERS.length - 1);
    }
    if (score > best) {
      best = score;
      try { localStorage.setItem('moonjar.best', String(best)); } catch (e) {}
    }
    paint();
  }

  function burst(x, y, r) {
    const n = Math.min(26, 9 + Math.round(r / 3.6));
    for (let k = 0; k < n; k++) {
      const a = rnd(0, 6.283), sp = rnd(0.7, 3.1);
      sparks.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 0.7, life: rnd(20, 40), r: rnd(0.9, 2.4) });
    }
  }

  function gameOver() {
    running = false;
    document.getElementById('finalScore').textContent = String(score);
    document.getElementById('finalSub').textContent = '가장 큰 달 · ' + TIERS[Math.max(0, biggest)].name;
    document.getElementById('verdict').textContent =
      biggest >= 7 ? '달항아리를 완성했습니다' : biggest >= 6 ? '보름달을 담았습니다' : '항아리가 찼습니다';
    document.getElementById('over').classList.add('on');
  }

  // ── drawing ─────────────────────────────────────────────────────────────────
  /** appends the jar silhouette to the current path — never starts a new one, so
      it can be combined with other subpaths (the drop zone above the rim) */
  function addJarPath() {
    const steps = 46;
    for (let k = 0; k <= steps; k++) {
      const y = jar.top + ((jar.bottom - jar.top) * k) / steps;
      const x = jar.cx - halfWidth(y);
      k === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    for (let k = steps; k >= 0; k--) {
      const y = jar.top + ((jar.bottom - jar.top) * k) / steps;
      ctx.lineTo(jar.cx + halfWidth(y), y);
    }
    ctx.closePath();
  }

  function jarPath() {
    ctx.beginPath();
    addJarPath();
  }

  function drawSky() {
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, '#060912');
    g.addColorStop(0.55, '#0e1628');
    g.addColorStop(1, '#141d33');
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, W, H);

    const tt = t0 * 0.002;
    for (const s of stars) {
      ctx.globalAlpha = s.a * (0.65 + 0.35 * Math.sin(tt + s.tw));
      ctx.fillStyle = '#e9f0ff';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, 6.283);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
  }

  function drawJarBody() {
    // outer glow so porcelain separates from the night
    ctx.save();
    ctx.shadowColor = 'rgba(190,210,255,0.20)';
    ctx.shadowBlur = 26;
    jarPath();
    const g = ctx.createLinearGradient(jar.cx - jar.rmax, jar.top, jar.cx + jar.rmax, jar.bottom);
    g.addColorStop(0, 'rgba(238,235,226,0.20)');
    g.addColorStop(0.42, 'rgba(214,213,206,0.10)');
    g.addColorStop(1, 'rgba(150,155,170,0.14)');
    ctx.fillStyle = g;
    ctx.fill();
    ctx.restore();

    // specular band down the left shoulder, the way glazed porcelain reads
    ctx.save();
    jarPath();
    ctx.clip();
    const sp = ctx.createLinearGradient(jar.cx - jar.rmax, 0, jar.cx - jar.rmax * 0.1, 0);
    sp.addColorStop(0, 'rgba(255,255,255,0.02)');
    sp.addColorStop(0.55, 'rgba(255,255,255,0.13)');
    sp.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = sp;
    ctx.fillRect(jar.cx - jar.rmax, jar.top, jar.rmax * 2, jar.bottom - jar.top);
    ctx.restore();
  }

  function drawJarRim() {
    ctx.beginPath();
    ctx.ellipse(jar.cx, jar.top, halfWidth(jar.top), 8, 0, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(243,238,226,0.5)';
    ctx.lineWidth = 1.6;
    ctx.stroke();

    jarPath();
    ctx.strokeStyle = 'rgba(243,238,226,0.34)';
    ctx.lineWidth = 1.3;
    ctx.stroke();
  }

  function drawMoon(x, y, tier, squash) {
    const sp = sprites[tier];
    if (!sp) return;
    const sq = squash || 0;
    const w = sp.size * (1 + sq), h = sp.size * (1 - sq);
    ctx.drawImage(sp.cv, x - w / 2, y - h / 2, w, h);
  }

  function draw() {
    drawSky();
    drawJarBody();

    // moons live inside the jar, plus the open air above the rim they fall through
    ctx.save();
    ctx.beginPath();
    ctx.rect(0, 0, W, jar.top);
    addJarPath();
    ctx.clip();
    for (const b of balls) drawMoon(b.x, b.y, b.tier, b.squash);
    ctx.restore();

    drawJarRim();

    for (const r of rings) {
      const e = 1 - Math.pow(1 - r.t, 2);
      ctx.globalAlpha = (1 - r.t) * 0.7;
      ctx.strokeStyle = '#ffe7a8';
      ctx.lineWidth = 2.4 * (1 - r.t) + 0.4;
      ctx.beginPath();
      ctx.arc(r.x, r.y, r.r0 * (1 + e * 1.5), 0, 6.283);
      ctx.stroke();
    }
    ctx.globalAlpha = 1;

    ctx.globalCompositeOperation = 'lighter';
    for (const s of sparks) {
      ctx.globalAlpha = Math.max(0, s.life / 40) * 0.9;
      ctx.fillStyle = '#ffe6a6';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, 6.283);
      ctx.fill();
    }
    ctx.globalCompositeOperation = 'source-over';
    ctx.globalAlpha = 1;

    if (running) {
      ctx.save();
      ctx.setLineDash([2, 7]);
      ctx.strokeStyle = 'rgba(243,238,226,0.22)';
      ctx.lineWidth = 1;
      ctx.beginPath();
      ctx.moveTo(aimX, jar.top - 8);
      ctx.lineTo(aimX, jar.bottom - 10);
      ctx.stroke();
      ctx.restore();
      drawMoon(aimX, Math.max(30, jar.top - 40), nextTier, 0);
      ctx.globalAlpha = 0.5;
      drawMoon(W - 28, 26, queuedTier, 0);
      ctx.globalAlpha = 1;
    }

    if (flash > 0) {
      ctx.fillStyle = 'rgba(255,236,180,' + (flash * 0.16).toFixed(3) + ')';
      ctx.fillRect(0, 0, W, H);
    }
  }

  function loop(ts) {
    t0 = ts || 0;
    if (running) step();
    draw();
    requestAnimationFrame(loop);
  }

  (function ladder() {
    const host = document.getElementById('ladder');
    host.innerHTML = '';
    TIERS.forEach((t, k) => {
      if (k) host.appendChild(document.createElement('u'));
      const i = document.createElement('i');
      const d = Math.round(7 + k * 2.4);
      i.style.width = d + 'px';
      i.style.height = d + 'px';
      host.appendChild(i);
    });
  })();

  window.addEventListener('resize', () => { resize(); aimX = clampAim(aimX); });
  resize();
  reset();
  requestAnimationFrame(loop);
})();
</script>
