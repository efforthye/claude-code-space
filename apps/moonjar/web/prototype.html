<title>Moon Jar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Serif+KR:wght@600&display=swap">

<style>
  /* 달항아리 — one rule: same moon + same moon = a fuller moon.
     No text needed to play. Committed to a single visual world (ink on hanji),
     so every colour is painted explicitly rather than inherited from a theme. */
  :root {
    --hanji: #ece3d2;
    --hanji-deep: #ded2bd;
    --ink: #221f1b;
    --ink-soft: #6b6357;
    --seal: #a8322a;
    --glaze: #f7f3ea;
    --moon: #fff8e2;
    --gold: #c9a24a;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; margin: 0; }
  body {
    background: var(--hanji);
    color: var(--ink);
    font-family: "Gowun Batang", "Nanum Myeongjo", Georgia, serif;
    display: flex; flex-direction: column; align-items: center;
    overflow: hidden; touch-action: manipulation;
    user-select: none; -webkit-user-select: none;
  }

  /* paper grain, drawn rather than downloaded */
  body::before {
    content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 0;
    background-image:
      radial-gradient(circle at 20% 10%, rgba(255,255,255,0.5), transparent 55%),
      radial-gradient(circle at 80% 85%, rgba(160,140,110,0.14), transparent 60%);
  }

  header {
    position: relative; z-index: 2; width: 100%; max-width: 460px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 14px 18px 6px; gap: 12px;
  }
  .score {
    font-family: "Noto Serif KR", serif; font-weight: 600;
    font-size: 40px; line-height: 1; letter-spacing: -0.02em;
    font-variant-numeric: tabular-nums; color: var(--ink);
  }
  .best {
    font-size: 13px; color: var(--ink-soft); letter-spacing: 0.02em;
    font-variant-numeric: tabular-nums; margin-top: 4px;
  }
  .best b { color: var(--gold); font-weight: 700; }

  button.icon {
    width: 44px; height: 44px; flex: 0 0 44px;
    border-radius: 50%; border: 1px solid rgba(34,31,27,0.18);
    background: rgba(255,255,255,0.4); color: var(--ink);
    cursor: pointer; display: grid; place-items: center;
    transition: background 0.15s, transform 0.08s;
  }
  button.icon:hover { background: rgba(255,255,255,0.75); }
  button.icon:active { transform: scale(0.94); }
  button.icon:focus-visible { outline: 2px solid var(--seal); outline-offset: 2px; }
  button.icon svg { width: 21px; height: 21px; fill: none; stroke: currentColor; stroke-width: 1.7; }

  #stage { position: relative; z-index: 1; flex: 1; width: 100%; display: block; }
  canvas { display: block; width: 100%; height: 100%; }

  /* the ladder of moons, so a first-time player can see where this is going */
  .ladder {
    position: relative; z-index: 2; display: flex; align-items: center; justify-content: center;
    gap: 3px; padding: 4px 0 14px; opacity: 0.75;
  }
  .ladder i {
    display: block; border-radius: 50%;
    background: radial-gradient(circle at 32% 30%, #fffdf6, var(--moon) 60%, #e6d9b8);
    box-shadow: 0 0 6px rgba(201,162,74,0.35);
  }
  .ladder span { color: var(--ink-soft); font-size: 11px; margin: 0 2px; }

  /* end card */
  .over {
    position: fixed; inset: 0; z-index: 10; display: none;
    align-items: center; justify-content: center; padding: 20px;
    background: rgba(236,227,210,0.9);
  }
  .over.on { display: flex; }
  .card {
    width: 100%; max-width: 340px; text-align: center;
    background: var(--glaze); border: 1px solid rgba(34,31,27,0.14);
    border-radius: 2px; padding: 30px 24px 26px;
    box-shadow: 0 18px 50px rgba(34,31,27,0.16);
  }
  .card .seal {
    width: 42px; height: 42px; margin: 0 auto 14px; border-radius: 3px;
    background: var(--seal); color: #f7f3ea; display: grid; place-items: center;
    font-family: "Noto Serif KR", serif; font-size: 19px; font-weight: 600;
  }
  .card h1 {
    margin: 0; font-family: "Noto Serif KR", serif; font-weight: 600; font-size: 22px;
  }
  .card .big {
    font-family: "Noto Serif KR", serif; font-size: 54px; font-weight: 600;
    line-height: 1.05; margin: 10px 0 2px; font-variant-numeric: tabular-nums;
  }
  .card .sub { color: var(--ink-soft); font-size: 13.5px; }
  .card .again {
    margin-top: 20px; width: 100%; padding: 14px; cursor: pointer;
    font-family: "Gowun Batang", serif; font-size: 16px; font-weight: 700;
    color: var(--glaze); background: var(--ink); border: 0; border-radius: 2px;
  }
  .card .again:active { transform: translateY(1px); }
  .card .again:focus-visible { outline: 2px solid var(--seal); outline-offset: 3px; }

  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<header>
  <div>
    <div class="score" id="score">0</div>
    <div class="best">최고 <b id="best">0</b></div>
  </div>
  <button class="icon" id="restart" aria-label="다시 시작">
    <svg viewBox="0 0 24 24" aria-hidden="true">
      <path d="M20 12a8 8 0 1 1-2.3-5.6" stroke-linecap="round"/>
      <path d="M20 4v4h-4" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>
</header>

<div id="stage"><canvas id="c"></canvas></div>

<div class="ladder" id="ladder" aria-hidden="true"></div>

<div class="over" id="over">
  <div class="card">
    <div class="seal">滿</div>
    <h1 id="verdict">항아리가 찼습니다</h1>
    <div class="big" id="finalScore">0</div>
    <div class="sub" id="finalSub">가장 큰 달 · 보름달</div>
    <button class="again" id="again">다시</button>
  </div>
</div>

<script>
(function () {
  'use strict';

  // ── the ladder of moons: one rule, eight rungs ───────────────────────────────
  // Radius grows, and the shape grows with it — a sliver becomes a crescent
  // becomes a half becomes a full moon. Nothing here needs reading.
  const TIERS = [
    { r: 11, name: '티끌',   phase: 0.00, glow: 0.35 },
    { r: 15, name: '별',     phase: 0.05, glow: 0.55 },
    { r: 20, name: '신월',   phase: 0.18, glow: 0.5 },
    { r: 26, name: '초승달', phase: 0.34, glow: 0.6 },
    { r: 34, name: '반달',   phase: 0.5,  glow: 0.7 },
    { r: 43, name: '상현달', phase: 0.68, glow: 0.8 },
    { r: 54, name: '보름달', phase: 1.0,  glow: 1.0 },
    { r: 66, name: '달항아리', phase: 1.0, glow: 1.25 },
  ];
  const DROPPABLE = 4;        // only the four smallest ever drop
  const GRAVITY = 0.55;
  const DAMP = 0.985;
  const WALL_BOUNCE = 0.38;
  const FLOOR_BOUNCE = 0.22;
  const OVERFLOW_GRACE = 1300; // ms above the rim before the jar is called full

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d');
  const stage = document.getElementById('stage');

  let W = 360, H = 600, DPR = 1;
  // jar geometry in canvas pixels
  let jar = { cx: 180, top: 150, bottom: 560, rmax: 150 };

  function resize() {
    const rect = stage.getBoundingClientRect();
    DPR = Math.min(2.5, window.devicePixelRatio || 1);
    W = Math.max(280, rect.width);
    H = Math.max(360, rect.height);
    canvas.width = Math.round(W * DPR);
    canvas.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    const margin = 14;
    const rmax = Math.min((W - margin * 2) / 2, H * 0.34);
    jar = {
      cx: W / 2,
      top: Math.max(96, H * 0.20),
      bottom: H - 18,
      rmax: rmax,
    };
  }

  /** interior half-width of the moon jar at a given y — the bulge is the shape */
  function halfWidth(y) {
    const t = (y - jar.top) / Math.max(1, jar.bottom - jar.top);
    if (t <= 0) return jar.rmax * 0.60;
    const tc = Math.min(1, t);
    return jar.rmax * (0.60 + 0.40 * Math.sin(Math.PI * Math.pow(tc, 0.86)));
  }

  // ── state ───────────────────────────────────────────────────────────────────
  let balls = [];
  let score = 0;
  let best = 0;
  try { best = Number(localStorage.getItem('moonjar.best') || 0) || 0; } catch (e) { best = 0; }
  let nextTier = 0;
  let queuedTier = 0;
  let aimX = 0;
  let dropCooldown = 0;
  let overflowSince = 0;
  let running = true;
  let biggest = 0;
  let sparks = [];

  function rnd(a, b) { return a + Math.random() * (b - a); }

  function newBall(x, y, tier, vx, vy) {
    return { x, y, tier, vx: vx || 0, vy: vy || 0, r: TIERS[tier].r, spin: rnd(-0.02, 0.02), a: rnd(0, 6.283) };
  }

  function reset() {
    balls = [];
    sparks = [];
    score = 0;
    biggest = 0;
    overflowSince = 0;
    dropCooldown = 0;
    running = true;
    nextTier = Math.floor(Math.random() * DROPPABLE);
    queuedTier = Math.floor(Math.random() * DROPPABLE);
    aimX = jar.cx;
    document.getElementById('over').classList.remove('on');
    paintScore();
  }

  function paintScore() {
    document.getElementById('score').textContent = String(score);
    document.getElementById('best').textContent = String(best);
  }

  // ── audio: a soft rising pentatonic chime per merge, synthesised ─────────────
  let ac = null;
  const PENTA = [0, 2, 4, 7, 9, 12, 14, 16];
  function chime(tier) {
    try {
      if (!ac) ac = new (window.AudioContext || window.webkitAudioContext)();
      const semi = PENTA[Math.min(PENTA.length - 1, tier)];
      const f = 261.63 * Math.pow(2, semi / 12);
      const t = ac.currentTime;
      const o = ac.createOscillator();
      const g = ac.createGain();
      o.type = 'sine';
      o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t);
      g.gain.exponentialRampToValueAtTime(0.16, t + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, t + 0.5);
      o.connect(g).connect(ac.destination);
      o.start(t);
      o.stop(t + 0.55);
    } catch (e) { /* audio is a nicety, never a requirement */ }
  }

  // ── input: one finger, anywhere ──────────────────────────────────────────────
  function clampAim(x) {
    const r = TIERS[nextTier].r;
    const lim = halfWidth(jar.top) - r - 2;
    return Math.max(jar.cx - lim, Math.min(jar.cx + lim, x));
  }
  function pointerX(e) {
    const rect = canvas.getBoundingClientRect();
    const cx = e.touches && e.touches[0] ? e.touches[0].clientX : e.clientX;
    return cx - rect.left;
  }
  function onMove(e) {
    if (!running) return;
    aimX = clampAim(pointerX(e));
  }
  function onDrop(e) {
    if (!running || dropCooldown > 0) return;
    aimX = clampAim(pointerX(e));
    balls.push(newBall(aimX, jar.top - 26, nextTier, 0, 1.5));
    nextTier = queuedTier;
    queuedTier = Math.floor(Math.random() * DROPPABLE);
    dropCooldown = 16;
    if (e.cancelable) e.preventDefault();
  }
  canvas.addEventListener('mousemove', onMove);
  canvas.addEventListener('touchmove', onMove, { passive: true });
  canvas.addEventListener('mouseup', onDrop);
  canvas.addEventListener('touchend', onDrop, { passive: false });

  document.getElementById('restart').addEventListener('click', reset);
  document.getElementById('again').addEventListener('click', reset);

  // ── physics ─────────────────────────────────────────────────────────────────
  function step() {
    if (dropCooldown > 0) dropCooldown--;

    for (const b of balls) {
      b.vy += GRAVITY;
      b.vx *= DAMP;
      b.vy *= 0.995;
      b.x += b.vx;
      b.y += b.vy;
      b.a += b.spin * (Math.abs(b.vx) + Math.abs(b.vy)) * 0.4;

      // walls follow the jar's curve
      const hw = halfWidth(b.y) - b.r;
      const dx = b.x - jar.cx;
      if (dx > hw) { b.x = jar.cx + hw; b.vx = -Math.abs(b.vx) * WALL_BOUNCE; }
      else if (dx < -hw) { b.x = jar.cx - hw; b.vx = Math.abs(b.vx) * WALL_BOUNCE; }

      if (b.y + b.r > jar.bottom) {
        b.y = jar.bottom - b.r;
        b.vy = -Math.abs(b.vy) * FLOOR_BOUNCE;
        b.vx *= 0.9;
      }
    }

    // pairwise: separate, and merge equals
    for (let i = 0; i < balls.length; i++) {
      for (let j = i + 1; j < balls.length; j++) {
        const a = balls[i], b = balls[j];
        let dx = b.x - a.x, dy = b.y - a.y;
        let d2 = dx * dx + dy * dy;
        const rr = a.r + b.r;
        if (d2 > rr * rr) continue;
        let d = Math.sqrt(d2) || 0.0001;

        if (a.tier === b.tier) {
          merge(i, j);
          i = -1; // restart the sweep: indices shifted
          break;
        }

        const nx = dx / d, ny = dy / d;
        const overlap = rr - d;
        const wa = b.r / rr, wb = a.r / rr;
        a.x -= nx * overlap * wa; a.y -= ny * overlap * wa;
        b.x += nx * overlap * wb; b.y += ny * overlap * wb;
        const rel = (b.vx - a.vx) * nx + (b.vy - a.vy) * ny;
        if (rel < 0) {
          const imp = rel * 0.5;
          a.vx += nx * imp; a.vy += ny * imp;
          b.vx -= nx * imp; b.vy -= ny * imp;
        }
      }
    }

    // overflow: a moon resting above the rim for long enough fills the jar
    let above = false;
    for (const b of balls) {
      if (b.y - b.r < jar.top - 4 && Math.abs(b.vy) < 1.6) { above = true; break; }
    }
    const now = performance.now();
    if (above) {
      if (!overflowSince) overflowSince = now;
      else if (now - overflowSince > OVERFLOW_GRACE) gameOver();
    } else {
      overflowSince = 0;
    }

    for (let i = sparks.length - 1; i >= 0; i--) {
      const s = sparks[i];
      s.x += s.vx; s.y += s.vy; s.vy += 0.06; s.life -= 1;
      if (s.life <= 0) sparks.splice(i, 1);
    }
  }

  function merge(i, j) {
    const a = balls[i], b = balls[j];
    const tier = a.tier;
    const x = (a.x + b.x) / 2, y = (a.y + b.y) / 2;
    balls.splice(Math.max(i, j), 1);
    balls.splice(Math.min(i, j), 1);

    score += (tier + 1) * (tier + 2) * 3;
    biggest = Math.max(biggest, tier + 1);
    chime(tier);
    burst(x, y, TIERS[tier].r);

    if (tier + 1 < TIERS.length) {
      balls.push(newBall(x, y, tier + 1, 0, -1.2));
    } else {
      // two full jars complete each other and depart, the way a watermelon does
      score += 600;
      burst(x, y, TIERS[tier].r * 1.8);
      chime(TIERS.length - 1);
    }
    if (score > best) {
      best = score;
      try { localStorage.setItem('moonjar.best', String(best)); } catch (e) { /* private mode */ }
    }
    paintScore();
  }

  function burst(x, y, r) {
    const n = Math.min(22, 8 + Math.round(r / 4));
    for (let k = 0; k < n; k++) {
      const ang = rnd(0, 6.283), sp = rnd(0.6, 2.6);
      sparks.push({ x, y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - 0.6, life: rnd(18, 34), r: rnd(1, 2.6) });
    }
  }

  function gameOver() {
    running = false;
    document.getElementById('finalScore').textContent = String(score);
    document.getElementById('finalSub').textContent =
      '가장 큰 달 · ' + TIERS[Math.max(0, biggest)].name;
    document.getElementById('verdict').textContent =
      biggest >= 6 ? '보름달을 담았습니다' : '항아리가 찼습니다';
    document.getElementById('over').classList.add('on');
  }

  // ── drawing ─────────────────────────────────────────────────────────────────
  function drawJar() {
    const steps = 42;
    ctx.save();

    // glaze body
    ctx.beginPath();
    ctx.moveTo(jar.cx - halfWidth(jar.top), jar.top);
    for (let k = 0; k <= steps; k++) {
      const y = jar.top + ((jar.bottom - jar.top) * k) / steps;
      ctx.lineTo(jar.cx - halfWidth(y), y);
    }
    for (let k = steps; k >= 0; k--) {
      const y = jar.top + ((jar.bottom - jar.top) * k) / steps;
      ctx.lineTo(jar.cx + halfWidth(y), y);
    }
    ctx.closePath();

    const g = ctx.createLinearGradient(jar.cx - jar.rmax, jar.top, jar.cx + jar.rmax, jar.bottom);
    g.addColorStop(0, 'rgba(255,255,255,0.82)');
    g.addColorStop(0.45, 'rgba(247,243,234,0.62)');
    g.addColorStop(1, 'rgba(214,203,182,0.5)');
    ctx.fillStyle = g;
    ctx.fill();

    ctx.clip();
    // a soft inner shadow along the left wall, the way porcelain catches light
    const sg = ctx.createLinearGradient(jar.cx - jar.rmax, 0, jar.cx + jar.rmax * 0.4, 0);
    sg.addColorStop(0, 'rgba(120,105,80,0.16)');
    sg.addColorStop(1, 'rgba(120,105,80,0)');
    ctx.fillStyle = sg;
    ctx.fillRect(jar.cx - jar.rmax, jar.top, jar.rmax * 2, jar.bottom - jar.top);
    ctx.restore();

    // rim line
    ctx.beginPath();
    ctx.ellipse(jar.cx, jar.top, halfWidth(jar.top), 7, 0, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(34,31,27,0.28)';
    ctx.lineWidth = 1.4;
    ctx.stroke();

    // outline
    ctx.beginPath();
    for (let k = 0; k <= steps; k++) {
      const y = jar.top + ((jar.bottom - jar.top) * k) / steps;
      const x = jar.cx - halfWidth(y);
      k === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    for (let k = steps; k >= 0; k--) {
      const y = jar.top + ((jar.bottom - jar.top) * k) / steps;
      ctx.lineTo(jar.cx + halfWidth(y), y);
    }
    ctx.strokeStyle = 'rgba(34,31,27,0.22)';
    ctx.lineWidth = 1.2;
    ctx.stroke();
  }

  function drawMoon(b) {
    const t = TIERS[b.tier];
    const r = b.r;
    ctx.save();
    ctx.translate(b.x, b.y);

    // halo
    const halo = ctx.createRadialGradient(0, 0, r * 0.5, 0, 0, r * 1.9);
    halo.addColorStop(0, 'rgba(255,246,214,' + (0.30 * t.glow).toFixed(3) + ')');
    halo.addColorStop(1, 'rgba(255,246,214,0)');
    ctx.fillStyle = halo;
    ctx.beginPath();
    ctx.arc(0, 0, r * 1.9, 0, Math.PI * 2);
    ctx.fill();

    // disc
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    const dg = ctx.createRadialGradient(-r * 0.32, -r * 0.36, r * 0.15, 0, 0, r * 1.1);
    dg.addColorStop(0, '#fffdf6');
    dg.addColorStop(0.6, '#fff5da');
    dg.addColorStop(1, '#e8d9b4');
    ctx.fillStyle = dg;
    ctx.fill();
    ctx.strokeStyle = 'rgba(150,128,86,0.35)';
    ctx.lineWidth = 1;
    ctx.stroke();

    // the phase: shave the disc with the paper colour so smaller moons are slivers
    if (t.phase < 0.999) {
      ctx.save();
      ctx.beginPath();
      ctx.arc(0, 0, r + 0.5, 0, Math.PI * 2);
      ctx.clip();
      const off = r * (1 - t.phase) * 1.5;
      ctx.beginPath();
      ctx.arc(off + r * 0.18, 0, r * 1.02, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(236,227,210,0.96)';
      ctx.fill();
      ctx.restore();
    }

    // a couple of maria, so the big moons read as moons
    if (b.tier >= 4) {
      ctx.globalAlpha = 0.1;
      ctx.fillStyle = '#8b7a56';
      ctx.beginPath(); ctx.arc(-r * 0.18, r * 0.1, r * 0.26, 0, 6.283); ctx.fill();
      ctx.beginPath(); ctx.arc(r * 0.22, -r * 0.24, r * 0.15, 0, 6.283); ctx.fill();
      ctx.globalAlpha = 1;
    }
    ctx.restore();
  }

  function drawAim() {
    if (!running) return;
    const r = TIERS[nextTier].r;
    ctx.save();
    ctx.setLineDash([3, 6]);
    ctx.strokeStyle = 'rgba(34,31,27,0.22)';
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(aimX, jar.top - 6);
    ctx.lineTo(aimX, jar.bottom - 8);
    ctx.stroke();
    ctx.restore();
    drawMoon({ x: aimX, y: jar.top - 30, tier: nextTier, r: r, a: 0 });

    // what comes after, small and off to the side
    ctx.save();
    ctx.globalAlpha = 0.55;
    drawMoon({ x: W - 30, y: 26, tier: queuedTier, r: Math.min(14, TIERS[queuedTier].r * 0.6), a: 0 });
    ctx.restore();
  }

  function draw() {
    ctx.clearRect(0, 0, W, H);
    drawJar();
    for (const b of balls) drawMoon(b);
    for (const s of sparks) {
      ctx.globalAlpha = Math.max(0, s.life / 34);
      ctx.fillStyle = '#f0dda6';
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, 6.283);
      ctx.fill();
    }
    ctx.globalAlpha = 1;
    drawAim();
  }

  function loop() {
    if (running) step();
    draw();
    requestAnimationFrame(loop);
  }

  // the visible ladder of moons under the jar
  (function buildLadder() {
    const host = document.getElementById('ladder');
    host.innerHTML = '';
    TIERS.forEach((t, k) => {
      if (k) {
        const s = document.createElement('span');
        s.textContent = '+';
        host.appendChild(s);
      }
      const i = document.createElement('i');
      const d = Math.round(8 + k * 2.6);
      i.style.width = d + 'px';
      i.style.height = d + 'px';
      host.appendChild(i);
    });
  })();

  window.addEventListener('resize', () => { resize(); aimX = clampAim(aimX); });
  resize();
  reset();
  loop();
})();
</script>
