# Fragment, not a pubspec. `scripts/new-flame-game.sh` merges this into the
# pubspec that `flutter create` generates — deps via `flutter pub add` (so version
# constraints stay current) and the assets block by patch.
#
# Kept as a readable record of what the template needs, so the same setup can be
# done by hand if the script is ever unavailable.

dependencies:
  flame: ^1.38.2 # requires Flutter >= 3.41
  shared_preferences: ^2.5.3 # GameSettings persistence

dev_dependencies:
  flame_test: any # FlameTester / testGameWidget, used by test/architecture_test.dart

# Asset roots. `images` and `audio` are Flame's lookup convention, not a
# preference: Sprite.load and FlameAudio read from exactly those paths.
# Registered by folder, so adding art later needs no pubspec edit.
flutter:
  assets:
    - assets/images/
    - assets/audio/
    - assets/data/

  # A game with no font of its own renders in the platform's system face, which
  # looks like a placeholder. Drop a licensed .ttf into assets/fonts/ and name
  # it here; AppText in lib/core/typography.dart reads these two family names
  # and nothing else refers to a font by name.
  #
  # fonts:
  #   - family: Body
  #     fonts:
  #       - asset: assets/fonts/<body>.ttf
  #   - family: Display
  #     fonts:
  #       - asset: assets/fonts/<display>.ttf
